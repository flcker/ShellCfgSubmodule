shell = "zsh"

# ─── fzf-tab（必须在 syntax-highlighting 之前）────────────────────────────────
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

# ─── autosuggestions ─────────────────────────────────────────────────────────
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

# ─── extract（解压任意格式的归档文件）─────────────────────────────────────────
[plugins.extract]
inline = '''
function extract() {
  if [[ -z "$1" ]]; then echo "Usage: extract <file>"; return 1; fi
  if [[ ! -f "$1" ]]; then echo "extract: '$1' is not a valid file"; return 1; fi
  case "$1" in
    *.tar.bz2|*.tbz2) tar xjf "$1"  ;;
    *.tar.gz|*.tgz)   tar xzf "$1"  ;;
    *.tar.xz)         tar xJf "$1"  ;;
    *.tar.zst)        tar --use-compress-program=unzstd -xf "$1" ;;
    *.tar)            tar xf  "$1"  ;;
    *.bz2)            bunzip2 "$1"  ;;
    *.gz)             gunzip  "$1"  ;;
    *.rar)            unrar x "$1"  ;;
    *.zip)            unzip   "$1"  ;;
    *.Z)              uncompress "$1" ;;
    *.7z)             7za x   "$1"  ;;
    *.xz)             unxz    "$1"  ;;
    *.zst)            unzstd  "$1"  ;;
    *) echo "extract: '$1' cannot be extracted via extract()" ;;
  esac
}
'''

# ─── zoxide（替代 zoxide.zsh 中的 eval）──────────────────────────────────────
[plugins.zoxide]
inline = 'command -v zoxide >/dev/null 2>&1 && eval "$(zoxide init zsh)"'

# ─── thefuck ─────────────────────────────────────────────────────────────────
[plugins.thefuck]
inline = 'command -v thefuck >/dev/null 2>&1 && eval "$(thefuck --alias)"'

# ─── syntax-highlighting（必须放最后）────────────────────────────────────────
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
