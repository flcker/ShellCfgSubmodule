[metadata]
name = "pl_slanted_none"
description = "Powerline with slanted separators, no head/tail"
modules_ref = "pl"
palette_keys = ["os_bg", "dark", "white", "blue", "green", "yellow", "red", "grey", "teal"]
default_fg_role = "dark"

[options]
add_newline = true
command_timeout = 10000
scan_timeout = 1000
fill_symbol = "─"

[format]
template = '''
$os\
$username\
$hostname\
[](bg:blue fg:os_bg)\
$directory\
[](bg:green fg:blue)\
$git_branch\
$git_status\
[](fg:green bg:grey)\
{LANG_MODULES}\
[](fg:grey bg:teal)\
$docker_context\
$nix_shell\
$conda\
[](fg:teal)\
$fill\
[](fg:grey)\
$jobs\
$status\
$cmd_duration\
[](fg:os_bg bg:grey)\
[  $time ](fg:{FG_ROLE} bg:os_bg)\
$line_break\
$character'''
