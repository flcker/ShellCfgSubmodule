# ── Metadata ─────────────────────────────────────────────────────────────────
# palette_keys: 调色板必须提供的颜色名
# compatible_separators: 可搭配的分隔符风格（对应 data/separators/ 文件名）
[metadata]
name = "pl"
description = "Powerline layout with background segments"
palette_keys = ["os_bg", "dark", "white", "blue", "green", "yellow", "red", "grey", "teal"]
default_fg_role = "dark"
compatible_separators = ["angled_round", "round_round", "slanted_round", "angled_sharp", "slanted_none"]

# ── Format Template ──────────────────────────────────────────────────────────
# 占位符说明:
#   {HEAD:color}         — 首段开口帽（无则省略）
#   {SEP:prev:next}      — 左侧段间过渡 [glyph](bg:next fg:prev)
#   {L_END:color}        — 左侧末段封口
#   {R_START:color}      — 右侧首段开口
#   {R_SEP:next:prev}    — 右侧段间过渡 [glyph](fg:next bg:prev)
#   {R_TAIL:color}       — 右侧末段封口帽（无则省略）
#   {LANG_MODULES}       — 展开为所有语言模块变量
#   {FG_ROLE}            — 由 palette hints.fg_role 决定的前景色
[format]
template = '''
{HEAD:os_bg}\
$os\
$username\
$hostname\
{SEP:os_bg:blue}\
$directory\
{SEP:blue:green}\
$git_branch\
$git_status\
{SEP:green:grey}\
{LANG_MODULES}\
{SEP:grey:teal}\
$docker_context\
$nix_shell\
$conda\
{L_END:teal}\
$fill\
{R_START:grey}\
$jobs\
$status\
$cmd_duration\
{R_SEP:os_bg:grey}\
[  $time ](fg:{FG_ROLE} bg:os_bg)\
{R_TAIL:os_bg}\
$line_break\
$character'''

# ── Language Order ───────────────────────────────────────────────────────────
[lang_order]
order = ["c", "cpp", "cmake", "rust", "golang", "nodejs", "bun", "deno", "php", "java", "kotlin", "gradle", "haskell", "haxe", "python", "ruby", "lua", "swift", "zig", "scala", "dart", "elixir", "elm", "julia", "perl", "ocaml", "nim", "crystal", "rlang", "fennel"]

# ── OS ────────────────────────────────────────────────────────────────────────
[modules.os]
disabled = false
style = "bg:os_bg fg:{FG_ROLE}"
format = "[ $symbol]($style)"

[modules.username]
show_always = true
style_user = "bg:os_bg fg:{FG_ROLE}"
style_root = "bg:os_bg fg:red"
format = '[ $user ]($style)'

[modules.hostname]
ssh_only = true
style = "bg:os_bg fg:{FG_ROLE}"
format = '[@$hostname ]($style)'

# ── Directory ─────────────────────────────────────────────────────────────────
[modules.directory]
style = "bg:blue fg:{FG_ROLE}"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
read_only = " 󰌾"
read_only_style = "bg:blue fg:{FG_ROLE}"

[modules.directory_substitutions]
"~" = " "
"Desktop" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰶚 "
"Musics" = "󰶚 "
"Video" = " "
"Videos" = " "
"Pictures" = " "
"Developer" = "󰲶 "
"Workspace" = "󰮮 "

# ── Git ───────────────────────────────────────────────────────────────────────
[modules.git_branch]
symbol = " "
style = "bg:green fg:{FG_ROLE}"
format = '[[ $symbol$branch ](fg:{FG_ROLE} bg:green)]($style)'

[modules.git_status]
style = "bg:green"
format = '([[$all_status$ahead_behind ](bg:green)]($style))'
conflicted = "[⚔${count}](fg:red bg:green)"
untracked = "[?${count}](fg:yellow bg:green)"
stashed = "[≡${count}](fg:{FG_ROLE} bg:green)"
modified = "[!${count}](fg:yellow bg:green)"
staged = "[+${count}](fg:{FG_ROLE} bg:green)"
renamed = "[»${count}](fg:yellow bg:green)"
deleted = "[✘${count}](fg:red bg:green)"
ahead = "[⇡${count}](fg:{FG_ROLE} bg:green)"
behind = "[⇣${count}](fg:{FG_ROLE} bg:green)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](fg:yellow bg:green)"
up_to_date = ""

[modules.git_commit]
tag_symbol = '  '

