# ── Containers / Environments ─────────────────────────────────────────────────
[modules.docker_context]
symbol = " "
style = "bg:teal"
format = '[[ $symbol($context) ](fg:{FG_ROLE} bg:teal)]($style)'

[modules.nix_shell]
symbol = " "
style = "bg:teal"
format = '[[ $symbol$state( \($name\)) ](fg:{FG_ROLE} bg:teal)]($style)'

[modules.conda]
symbol = "  "
style = "fg:{FG_ROLE} bg:teal"
format = '[$symbol$environment ]($style)'
ignore_base = false

# ── Fill ──────────────────────────────────────────────────────────────────────
[modules.fill]
symbol = "─"
style = "fg:grey"

# ── Jobs ──────────────────────────────────────────────────────────────────────
[modules.jobs]
disabled = false
symbol = "✦"
style = "bold fg:{FG_ROLE} bg:grey"
number_threshold = 1
format = "[ $symbol$number ]($style)"

# ── Status ────────────────────────────────────────────────────────────────────
[modules.status]
disabled = false
style = "bold fg:{FG_ROLE} bg:grey"
symbol = "✘"
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
format = '[ $symbol $status ]($style)'

# ── Command Duration ──────────────────────────────────────────────────────────
[modules.cmd_duration]
min_time = 10
show_milliseconds = true
show_notifications = true
min_time_to_notify = 5000
style = "fg:{FG_ROLE} bg:grey"
format = "[ 󱎫 $duration ]($style)"
disabled = false

# ── Time ──────────────────────────────────────────────────────────────────────
[modules.time]
disabled = false
time_format = "%R"
style = "fg:{FG_ROLE} bg:os_bg"
format = '  $time '

# ── Line Break ────────────────────────────────────────────────────────────────
[modules.line_break]
disabled = false
