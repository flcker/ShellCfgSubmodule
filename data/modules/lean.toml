[lang_order]
order = ["c", "cpp", "cmake", "rust", "golang", "zig", "nodejs", "bun", "deno", "php", "java", "kotlin", "gradle", "scala", "python", "ruby", "lua", "perl", "haskell", "haxe", "swift", "dart", "elixir", "elm", "julia", "ocaml", "nim", "crystal", "rlang", "fennel"]

# ── OS (disabled in lean) ─────────────────────────────────────────────────────
[modules.os]
disabled = true

[modules.username]
disabled = true

# ── Hostname (SSH only) ───────────────────────────────────────────────────────
[modules.hostname]
ssh_only = true
style = "bold fg:yellow"
format = '[$ssh_symbol$hostname ]($style)'
ssh_symbol = "ssh:"

# ── Directory ─────────────────────────────────────────────────────────────────
[modules.directory]
style = "bold fg:blue"
format = "[$path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
read_only = "RO"
read_only_style = "fg:red"

[modules.directory_substitutions]

# ── Git ───────────────────────────────────────────────────────────────────────
[modules.git_branch]
symbol = ""
style = "fg:green"
format = '[$symbol$branch ]($style)'

[modules.git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style))'
conflicted = "⚔ "
untracked = "? "
stashed = "≡ "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ "
up_to_date = ""

[modules.git_state]
style = "fg:red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[modules.git_commit]
tag_symbol = ' tag:'

# ── Languages: System ─────────────────────────────────────────────────────────
[modules.c]
symbol = ""
style = "fg:sys_lang"
format = '[$symbol($version) ]($style)'

[modules.cpp]
symbol = " "
style = "fg:sys_lang"
format = '[$symbol($version) ]($style)'

[modules.cmake]
