# ── Containers / Environments ─────────────────────────────────────────────────
[modules.docker_context]
symbol = " "
style = "fg:env_color"
format = '[$symbol($context) ]($style)'

[modules.nix_shell]
symbol = " "
style = "fg:env_color"
format = '[$symbol$state( \($name\)) ]($style)'

[modules.conda]
symbol = "  "
style = "fg:env_color"
format = '[$symbol$environment ]($style)'
ignore_base = false

# ── Fill ──────────────────────────────────────────────────────────────────────
[modules.fill]
symbol = "─"
style = "fg:muted"

# ── Jobs ──────────────────────────────────────────────────────────────────────
[modules.jobs]
disabled = false
symbol = "✦"
style = "bold fg:blue"
number_threshold = 1
format = "[$symbol$number ]($style)"

# ── Status ────────────────────────────────────────────────────────────────────
[modules.status]
disabled = false
style = "bold fg:red"
symbol = "✘"
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
format = '[$symbol $status ]($style)'

# ── Command Duration ──────────────────────────────────────────────────────────
[modules.cmd_duration]
min_time = 10
show_milliseconds = true
show_notifications = true
min_time_to_notify = 5000
style = "fg:yellow"
format = "[󱎫 $duration ]($style)"
disabled = false

# ── Time ──────────────────────────────────────────────────────────────────────
[modules.time]
disabled = false
time_format = "%R"
style = "fg:muted"
format = '[ $time ]($style)'

# ── Line Break ────────────────────────────────────────────────────────────────
[modules.line_break]
disabled = false
