# ============================================================
# cc-tools 配置文件
# ============================================================
# 厂商: vendor.<name>.<field>=<value>
#   url      — API 地址（可选，Claude 官方省略默认走 api.anthropic.com）
#   key      — API 密钥（必需）
#   models   — 切换厂商时应用的默认模型，逗号分隔: opus,sonnet,haiku
#
# 厂商预设: vendor.<name>.preset.<name>.<field>=<model>
#   current — ANTHROPIC_MODEL（可选，缺失取 opus）
#   opus    — Opus 模型（必需）
#   sonnet  — Sonnet 模型（必需）
#   haiku   — Haiku 模型（必需）
#   cc model <name> 基于当前厂商查找预设
#
# auto = 启动时自动切换的厂商（可选）
# ============================================================

# --- TAL Coding（公司多模型代理）---
