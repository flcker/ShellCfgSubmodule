# ============================================================
# cc-tools 配置文件
# ============================================================
# 厂商: vendor.<name>.<field>=<value>
#   url      — API 地址（可选，Claude 官方省略默认走 api.anthropic.com）
#   key      — API 密钥（必需）
#   models   — 切换厂商时应用的默认模型，逗号分隔: opus,sonnet,haiku
#   env.<VAR> — 切换厂商时 export 为真实环境变量 VAR（可选，配了才 export；VAR 名会被大写化）
#
# 厂商预设: vendor.<name>.preset.<name>.<field>=<model>
#   current — ANTHROPIC_MODEL（可选，缺失取 opus）
#   opus    — Opus 模型（必需）
#   sonnet  — Sonnet 模型（必需）
#   haiku   — Haiku 模型（必需）
#   env.<VAR> — 切换预设时 export 为真实环境变量 VAR（可选，配了才 export；VAR 名会被大写化）
#   cc model <name> 基于当前厂商查找预设
#
# auto = 启动时自动切换的厂商[:预设]（可选）
# ============================================================

# --- 多模型代理（可混用不同厂商的模型）---
#vendor.multi.url=http://your-proxy.com
#vendor.multi.key=sk-...
#vendor.multi.models=claude-opus-4.8,deepseek-v4-pro,deepseek-v4-flash
#vendor.multi.preset.heavy.current=claude-opus-4.8
#vendor.multi.preset.heavy.opus=claude-opus-4.8
#vendor.multi.preset.heavy.sonnet=claude-sonnet-4.6
#vendor.multi.preset.heavy.haiku=claude-haiku-4.5
#vendor.multi.preset.lite.opus=deepseek-v4-flash
#vendor.multi.preset.lite.sonnet=deepseek-v4-flash
#vendor.multi.preset.lite.haiku=deepseek-v4-flash

# --- DeepSeek（Claude Code 兼容）---
# 官方文档: https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/claude_code
# Claude 兼容端点是 /anthropic（非 https://api.deepseek.com 根路径）
# 1M 上下文同样靠模型名 [1m] 后缀开启，AUTO_COMPACT_WINDOW 官方推荐 786432（768K）
#vendor.ds.url=https://api.deepseek.com/anthropic
#vendor.ds.key=sk-...
#vendor.ds.models=deepseek-v4-pro[1m],deepseek-v4-pro[1m],deepseek-v4-flash
#vendor.ds.env.CLAUDE_CODE_AUTO_COMPACT_WINDOW=786432

# --- GLM（智谱，Claude Code 兼容）---
# 官方文档: https://docs.bigmodel.cn/cn/guide/develop/claude
# Claude 兼容端点是 /api/anthropic（非 OpenAI 的 /api/paas/v4）
#vendor.glm.url=https://open.bigmodel.cn/api/anthropic
#vendor.glm.key=sk-...
#vendor.glm.models=glm-5.2[1m],glm-5.2[1m],glm-5.1[1m]
# 长上下文（1M）= 模型名 [1m] 后缀 + AUTO_COMPACT_WINDOW，两者缺一不可：
#   [1m] 后缀       = 1M 能力开关（CC 检测后缀发 context-1m beta header，API 端才认 >200K）
#                     不加后缀 → API 端按 200K 处理，CC 客户端即便不压缩也会变傻/截断
#   AUTO_COMPACT_WINDOW = CC 端压缩触发阈值，优先级最高；未设走 unknown-model 默认 ~200K
#   MAX_CONTEXT_TOKENS  = 可选，模型窗口认知；官方文档未提，[1m] 生效后一般用不到
#vendor.glm.env.CLAUDE_CODE_AUTO_COMPACT_WINDOW=1000000
# 预设级 env：cc model <preset> 时 export，切预设/厂商或 cc official 时 unset
#vendor.glm.preset.glm.env.CLAUDE_CODE_AUTO_COMPACT_WINDOW=1000000

# --- Claude 官方 ---
#vendor.claude.key=sk-ant-...
#vendor.claude.models=claude-opus-4.8,claude-sonnet-4.6,claude-haiku-4.5

