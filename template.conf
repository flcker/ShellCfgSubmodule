# ============================================================
# cc-tools 配置文件
# ============================================================
# 厂商: vendor.<name>.<field>=<value>
#   url      — API 地址（可选，Claude 官方省略默认走 api.anthropic.com）
#   key      — API 密钥（必需）
#   models   — 切换厂商时应用的默认模型，逗号分隔: opus,sonnet,haiku
#   env.<VAR> — 切换厂商时 export 为真实环境变量 VAR（可选，配了才 export；VAR 名会被大写化）
#
# 厂商预设: vendor.<name>.preset.<name>.<field>=<model>
#   current — ANTHROPIC_MODEL（可选，缺失取 opus）
#   opus    — Opus 模型（必需）
#   sonnet  — Sonnet 模型（必需）
#   haiku   — Haiku 模型（必需）
#   env.<VAR> — 切换预设时 export 为真实环境变量 VAR（可选，配了才 export；VAR 名会被大写化）
#   cc model <name> 基于当前厂商查找预设
#
# auto = 启动时自动切换的厂商[:预设]（可选）
# ============================================================

# --- 多模型代理（可混用不同厂商的模型）---
#vendor.multi.url=http://your-proxy.com
#vendor.multi.key=sk-...
#vendor.multi.models=claude-opus-4.8,deepseek-v4-pro,deepseek-v4-flash
#vendor.multi.preset.heavy.current=claude-opus-4.8
#vendor.multi.preset.heavy.opus=claude-opus-4.8
#vendor.multi.preset.heavy.sonnet=claude-sonnet-4.6
#vendor.multi.preset.heavy.haiku=claude-haiku-4.5
#vendor.multi.preset.lite.opus=deepseek-v4-flash
#vendor.multi.preset.lite.sonnet=deepseek-v4-flash
#vendor.multi.preset.lite.haiku=deepseek-v4-flash

# --- DeepSeek（自购）---
#vendor.ds.url=https://api.deepseek.com
#vendor.ds.key=sk-...
#vendor.ds.models=deepseek-v4-pro,deepseek-v4-pro,deepseek-v4-flash

# --- GLM（智谱）---
#vendor.glm.url=https://open.bigmodel.cn/api/paas/v4
#vendor.glm.key=sk-...
#vendor.glm.models=glm-5.2,glm-5.2,glm-4.7
# 长上下文（未知模型需手动声明，两个变量缺一不可）：
#   CLAUDE_CODE_MAX_CONTEXT_TOKENS = 模型窗口认知（CC 认为能塞多少），不控制压缩时机
#   CLAUDE_CODE_AUTO_COMPACT_WINDOW = 压缩触发阈值（用到多少 token 压缩），优先级最高
#   ⚠ 只设 MAX_CONTEXT_TOKENS 不够：AUTO_COMPACT_WINDOW 未设时走 unknown-model 默认 ~200K，
#     会 ~196K 就压缩。两者都要设。glm-5.2 真实窗口 1M（最大输出 128K）。
#vendor.glm.env.CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000
#vendor.glm.env.CLAUDE_CODE_AUTO_COMPACT_WINDOW=800000
# 预设级 env：cc model <preset> 时 export，切预设/厂商或 cc official 时 unset
#vendor.glm.preset.glm.env.CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000
#vendor.glm.preset.glm.env.CLAUDE_CODE_AUTO_COMPACT_WINDOW=800000

# --- Claude 官方 ---
#vendor.claude.key=sk-ant-...
#vendor.claude.models=claude-opus-4.8,claude-sonnet-4.6,claude-haiku-4.5

