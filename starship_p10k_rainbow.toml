style = "bg:grey"
format = '[[ $symbol($version) ](fg:white bg:grey)]($style)'

[ocaml]
symbol = " "
style = "bg:grey"
format = '[[ $symbol($version) ](fg:white bg:grey)]($style)'

[nim]
symbol = "󰆥 "
style = "bg:grey"
format = '[[ $symbol($version) ](fg:white bg:grey)]($style)'

[crystal]
symbol = " "
style = "bg:grey"
format = '[[ $symbol($version) ](fg:white bg:grey)]($style)'

[rlang]
symbol = "󰟔 "
style = "bg:grey"
format = '[[ $symbol($version) ](fg:white bg:grey)]($style)'

[fennel]
symbol = " "
style = "bg:grey"
format = '[[ $symbol($version) ](fg:white bg:grey)]($style)'

# ── Containers / Environments ─────────────────────────────────────────────────
[docker_context]
symbol = " "
style = "bg:teal"
format = '[[ $symbol($context) ](fg:white bg:teal)]($style)'

[nix_shell]
symbol = " "
style = "bg:teal"
format = '[[ $symbol$state( \($name\)) ](fg:white bg:teal)]($style)'

[conda]
symbol = "  "
style = "fg:white bg:teal"
format = '[$symbol$environment ]($style)'
ignore_base = false

# ── Fill (连接线) ─────────────────────────────────────────────────────────────
[fill]
symbol = "─"    # 可选: "·" "." "━" "╌" "┄" " "(空格=无连接线)
style = "fg:grey"

# ── Jobs ──────────────────────────────────────────────────────────────────────
[jobs]
disabled = false
symbol = "✦"                   # 可选: ✦ ⚙
style = "bold fg:yellow bg:grey"
number_threshold = 1
format = "[ $symbol$number ]($style)"

# ── Status ────────────────────────────────────────────────────────────────────
[status]
disabled = false
style = "bold fg:red bg:grey"
symbol = "✘"                   # 可选: ✘ ✗ ✖  ×
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
format = '[ $symbol $status ]($style)'

# ── Command Duration ──────────────────────────────────────────────────────────
[cmd_duration]
min_time = 10
show_milliseconds = true
show_notifications = true
min_time_to_notify = 5000
style = "fg:yellow bg:grey"
format = "[ 󱎫 $duration ]($style)"
disabled = false

# ── Time ──────────────────────────────────────────────────────────────────────
[time]
disabled = false
time_format = "%R"             # %R=HH:MM  %T=HH:MM:SS  %r=12h
style = "fg:dark bg:os_bg"
format = '  $time '

# ── Line Break & Character ────────────────────────────────────────────────────
[line_break]
disabled = false               # false=双行提示  true=单行(segment后直接输入)

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'    # 可选: ❯ ➜ ▶  λ ∮ ➤
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:yellow)'
vimcmd_replace_symbol = '[❮](bold fg:yellow)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# ── Palette ───────────────────────────────────────────────────────────────────
# Rainbow 与 Classic 仅 palette 色值不同（含 format 中 fg:dark/fg:white 的对应差异）
[palettes.p10k_rainbow]
os_bg = "#d0d0d0"
dark = "#1c1c1c"
white = "#ffffff"
blue = "#005fd7"
green = "#00af00"
yellow = "#d7af00"
red = "#d70000"
grey = "#4e4e4e"
teal = "#005f87"